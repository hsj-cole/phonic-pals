<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Phonics Pals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* ── TOKENS ── */
:root {
  --bg:         #f0faf8;
  --bg2:        #e0f4f0;
  --card:       #ffffff;
  --ink:        #1a3a35;
  --ink-soft:   #4a7a72;
  --border:     #c0e8e0;
  --accent:     #0f766e;    /* teal */
  --accent2:    #0d9488;
  --accent-lt:  #ccfbf1;
  --yellow:     #fef9c3;
  --yellow-dk:  #ca8a04;
  --green:      #dcfce7;
  --green-dk:   #15803d;
  --red:        #fee2e2;
  --red-dk:     #b91c1c;
  --shadow-sm:  0 1px 3px rgba(0,0,0,.08);
  --shadow-md:  0 4px 12px rgba(0,0,0,.12);
  --r:          16px;
  --r-sm:       10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:        #0d2420;
    --bg2:       #112e28;
    --card:      #1a3a33;
    --ink:       #d4f5ef;
    --ink-soft:  #7ec9be;
    --border:    #2a5048;
    --accent:    #2dd4bf;
    --accent2:   #14b8a6;
    --accent-lt: #042f2e;
    --yellow:    #3d3200;
    --yellow-dk: #fde047;
    --green:     #052e16;
    --green-dk:  #4ade80;
    --red:       #3b0000;
    --red-dk:    #f87171;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg:        #0d2420;
  --bg2:       #112e28;
  --card:      #1a3a33;
  --ink:       #d4f5ef;
  --ink-soft:  #7ec9be;
  --border:    #2a5048;
  --accent:    #2dd4bf;
  --accent2:   #14b8a6;
  --accent-lt: #042f2e;
  --yellow:    #3d3200;
  --yellow-dk: #fde047;
  --green:     #052e16;
  --green-dk:  #4ade80;
  --red:       #3b0000;
  --red-dk:    #f87171;
  color-scheme: dark;
}

/* ── RESET / BASE ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body {
  font-family: 'Nunito', sans-serif;
  background: var(--bg);
  color: var(--ink);
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding-left: max(16px, env(safe-area-inset-left,0px));
  padding-right: max(16px, env(safe-area-inset-right,0px));
}
button { cursor:pointer; border:none; background:none; font-family:inherit; }

/* ── SCREENS ── */
.screen { display:none; flex-direction:column; flex:1; }
.screen.active { display:flex; }

/* ══════════════════════════════════════
   HOME SCREEN
══════════════════════════════════════ */
#screen-home {
  align-items: center;
  padding: 24px 0 32px;
  gap: 20px;
  overflow-y: auto;
}
.home-hero {
  text-align: center;
  padding-top: 8px;
}
.home-hero .app-emoji { font-size: 4rem; display:block; margin-bottom:4px; }
.home-hero h1 {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(2rem, 7vw, 3rem);
  color: var(--accent);
  line-height: 1;
}
.home-hero p {
  color: var(--ink-soft);
  font-size: .95rem;
  font-weight: 600;
  margin-top: 4px;
}

/* Group selector */
.group-section {
  width: 100%;
  max-width: 480px;
  background: var(--card);
  border-radius: var(--r);
  border: 1.5px solid var(--border);
  box-shadow: var(--shadow-sm);
  padding: 18px 20px;
}
.group-section h2 {
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  color: var(--ink-soft);
  margin-bottom: 12px;
  text-align: center;
}
.group-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: center;
  margin-bottom: 14px;
}
.group-pill {
  width: 48px; height: 48px;
  border-radius: 50%;
  border: 2.5px solid var(--border);
  background: var(--bg);
  font-family: 'Fredoka One', cursive;
  font-size: 1.2rem;
  color: var(--ink-soft);
  transition: all .15s;
  display: flex; align-items:center; justify-content:center;
}
.group-pill.selected {
  background: var(--accent);
  border-color: var(--accent);
  color: #fff;
  box-shadow: 0 3px 8px rgba(15,118,110,.35);
}
.group-letters {
  font-size: .78rem;
  font-weight: 700;
  color: var(--ink-soft);
  text-align: center;
  letter-spacing: .03em;
  min-height: 1.4em;
}

/* Menu buttons */
.menu-section {
  width: 100%;
  max-width: 480px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.menu-btn {
  display: flex;
  align-items: center;
  gap: 14px;
  background: var(--card);
  border-radius: var(--r);
  border: 1.5px solid var(--border);
  padding: 16px 20px;
  box-shadow: var(--shadow-sm);
  transition: transform .12s, box-shadow .12s;
  text-align: left;
  color: var(--ink);
}
.menu-btn:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.menu-btn:active { transform: translateY(0); }
.menu-btn .btn-icon {
  font-size: 2rem;
  flex-shrink: 0;
  width: 52px; height: 52px;
  border-radius: 14px;
  display: flex; align-items:center; justify-content:center;
}
.menu-btn .btn-info { flex: 1; }
.menu-btn .btn-title {
  font-family: 'Fredoka One', cursive;
  font-size: 1.2rem;
  color: var(--accent2);
}
.menu-btn .btn-desc {
  font-size: .8rem;
  font-weight: 600;
  color: var(--ink-soft);
  margin-top: 1px;
}
.menu-btn.color-green  { border-top: 4px solid #22c55e; }
.menu-btn.color-green  .btn-icon { background: #dcfce7; }
.menu-btn.color-blue   { border-top: 4px solid #3b82f6; }
.menu-btn.color-blue   .btn-icon { background: #dbeafe; }
.menu-btn.color-purple { border-top: 4px solid #a855f7; }
.menu-btn.color-purple .btn-icon { background: #f3e8ff; }

/* ══════════════════════════════════════
   GAME TOPBAR
══════════════════════════════════════ */
.game-topbar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 12px 16px 8px;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  background: var(--bg);
  z-index: 20;
}
.back-btn {
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 10px;
  padding: 6px 12px;
  font-family: 'Fredoka One', cursive;
  font-size: .95rem;
  color: var(--ink-soft);
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}
.back-btn:hover { color: var(--accent); }
.game-title {
  font-family: 'Fredoka One', cursive;
  font-size: clamp(1.1rem,4vw,1.6rem);
  color: var(--accent2);
  flex: 1;
  text-align: center;
}

/* ══════════════════════════════════════
   SCORE BAR
══════════════════════════════════════ */
.score-bar {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 20px;
  padding: 6px 20px 10px;
  flex-shrink: 0;
}
.score-pill {
  display: flex; align-items:center; gap:5px;
  background: var(--card);
  border: 1.5px solid var(--border);
  border-radius: 20px;
  padding: 5px 14px;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
}
.score-pill .sc-label { color: var(--ink-soft); font-size:.75rem; font-family:'Nunito',sans-serif; font-weight:700; }
.score-pill .sc-num   { color: var(--accent); }

/* ══════════════════════════════════════
   GAME 1 — FIND THE SOUND
══════════════════════════════════════ */
#screen-g1 { overflow-y:auto; }

.g1-stage {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 16px 0 24px;
  gap: 20px;
}
.g1-prompt-box {
  text-align: center;
}
.g1-prompt {
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: var(--ink-soft);
  margin-bottom: 10px;
}
.play-btn {
  width: 86px; height: 86px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 2.4rem;
  display: flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 16px rgba(15,118,110,.35), 0 2px 0 rgba(0,0,0,.12);
  transition: transform .12s, box-shadow .12s;
  margin: 0 auto;
}
.play-btn:hover { transform: scale(1.06); }
.play-btn:active { transform: scale(.96); box-shadow: 0 1px 6px rgba(15,118,110,.25); }
.play-btn.playing { animation: pulse-btn .6s infinite alternate; }
@keyframes pulse-btn { to { box-shadow: 0 4px 24px rgba(15,118,110,.6); } }

.g1-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 400px;
  padding: 0 4px;
}
.letter-opt {
  aspect-ratio: 1;
  border-radius: 18px;
  background: var(--yellow);
  border: none;
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  color: var(--accent);
  display: flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-sm), 0 3px 0 rgba(0,0,0,.08);
  transition: transform .12s, box-shadow .12s;
  position: relative;
  overflow: hidden;
}
.letter-opt:hover { transform: translateY(-2px); box-shadow: var(--shadow-md), 0 3px 0 rgba(0,0,0,.08); }
.letter-opt:active { transform: scale(.96); }
.letter-opt.correct {
  background: var(--green);
  color: var(--green-dk);
  animation: pop-correct .35s ease;
}
.letter-opt.wrong {
  background: var(--red);
  color: var(--red-dk);
  animation: shake-wrong .35s ease;
}
@keyframes pop-correct { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }
@keyframes shake-wrong { 0%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} 100%{transform:translateX(0)} }

/* digraph letters */
.letter-opt .dg { font-size: 1.5rem; }

.g1-feedback {
  font-family: 'Fredoka One', cursive;
  font-size: 1.5rem;
  color: var(--accent2);
  min-height: 2em;
  text-align: center;
}
.g1-next-btn {
  background: var(--accent);
  color: #fff;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  border-radius: 24px;
  padding: 12px 32px;
  box-shadow: 0 3px 10px rgba(15,118,110,.3);
  display: none;
}
.g1-next-btn.show { display: block; }

/* ══════════════════════════════════════
   GAME 2 — BLEND
══════════════════════════════════════ */
#screen-g2 { overflow-y:auto; }

.g2-stage {
  flex:1;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 12px 0 24px;
  gap: 16px;
}

.blend-level-tabs {
  display: flex;
  gap: 8px;
  background: var(--bg2);
  border-radius: 20px;
  padding: 4px;
}
.blend-tab {
  padding: 7px 18px;
  border-radius: 16px;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: var(--ink-soft);
  transition: all .15s;
}
.blend-tab.active {
  background: var(--accent);
  color: #fff;
  box-shadow: 0 2px 8px rgba(15,118,110,.3);
}

/* Word display */
.word-display {
  display: flex;
  gap: 8px;
  align-items: center;
  min-height: 90px;
}
.letter-box {
  width: 72px; height: 86px;
  border-radius: 18px;
  background: var(--yellow);
  border: 2.5px solid #fde68a;
  font-family: 'Fredoka One', cursive;
  font-size: 2.4rem;
  color: var(--accent);
  display: flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-sm), 0 4px 0 rgba(0,0,0,.09);
  transition: all .2s;
  position: relative;
}
.letter-box.vowel {
  background: #fce7f3;
  border-color: #fbcfe8;
  color: #9d174d;
}
.letter-box.digraph {
  width: 108px;
  font-size: 1.8rem;
}
.letter-box.blank {
  background: var(--bg2);
  border-color: var(--border);
  color: var(--border);
  font-size: 2rem;
}
.letter-box.reveal {
  animation: flip-reveal .4s ease;
}
@keyframes flip-reveal {
  0%  { transform: rotateY(0deg) scale(1); }
  50% { transform: rotateY(90deg) scale(.8); }
  100%{ transform: rotateY(0deg) scale(1); }
}

.g2-play-row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.g2-play-btn {
  width: 70px; height: 70px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  font-size: 2rem;
  display: flex; align-items:center; justify-content:center;
  box-shadow: 0 4px 14px rgba(15,118,110,.3);
  transition: transform .12s;
}
.g2-play-btn:hover { transform: scale(1.07); }
.g2-play-btn:active { transform: scale(.95); }
.g2-blend-btn {
  padding: 12px 22px;
  border-radius: 20px;
  background: var(--card);
  border: 2px solid var(--accent);
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: var(--accent);
  transition: all .15s;
}
.g2-blend-btn:hover { background:var(--accent); color:#fff; }

/* Options */
.g2-opts-label {
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
  color: var(--ink-soft);
}
.g2-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(72px, 1fr));
  gap: 10px;
  width: 100%;
  max-width: 400px;
  padding: 0 4px;
}
.g2-opt {
  aspect-ratio: 1;
  border-radius: 18px;
  background: var(--yellow);
  font-family: 'Fredoka One', cursive;
  font-size: 2.2rem;
  color: var(--accent);
  display: flex; align-items:center; justify-content:center;
  box-shadow: var(--shadow-sm), 0 3px 0 rgba(0,0,0,.08);
  transition: transform .12s;
}
.g2-opt:hover { transform: translateY(-2px); }
.g2-opt:active { transform: scale(.96); }
.g2-opt.selected {
  background: var(--accent-lt);
  border: 2.5px solid var(--accent);
}
.g2-opt.correct { background: var(--green); color: var(--green-dk); animation: pop-correct .35s ease; }
.g2-opt.wrong   { background: var(--red); color: var(--red-dk); animation: shake-wrong .35s ease; }
.g2-opt .dg { font-size: 1.5rem; }

.g2-feedback {
  font-family: 'Fredoka One', cursive;
  font-size: 1.4rem;
  color: var(--accent2);
  min-height: 1.8em;
  text-align: center;
}
.g2-next-btn {
  background: var(--accent);
  color: #fff;
  font-family: 'Fredoka One', cursive;
  font-size: 1.1rem;
  border-radius: 24px;
  padding: 12px 32px;
  box-shadow: 0 3px 10px rgba(15,118,110,.3);
  display: none;
}
.g2-next-btn.show { display: block; }

/* CVC word phase */
.cvc-word-reveal {
  font-family: 'Fredoka One', cursive;
  font-size: 1.3rem;
  color: var(--ink-soft);
  text-align: center;
}
.cvc-word-reveal span { color: var(--accent); font-size: 1.6rem; }

/* ══════════════════════════════════════
   RESULT OVERLAY
══════════════════════════════════════ */
.result-overlay {
  position: fixed; inset:0;
  background: rgba(0,0,0,.55);
  display: none; align-items:center; justify-content:center;
  z-index: 100;
  padding: 24px;
}
.result-overlay.show { display:flex; }
.result-card {
  background: var(--card);
  border-radius: 24px;
  padding: 32px 28px;
  text-align: center;
  max-width: 320px;
  width: 100%;
  box-shadow: 0 20px 60px rgba(0,0,0,.3);
}
.result-card .big-emoji { font-size: 4rem; display:block; margin-bottom:8px; }
.result-card h2 {
  font-family: 'Fredoka One', cursive;
  font-size: 1.8rem;
  color: var(--accent2);
  margin-bottom: 6px;
}
.result-card p { color: var(--ink-soft); font-weight:700; margin-bottom:20px; }
.result-card .score-big {
  font-family: 'Fredoka One', cursive;
  font-size: 3rem;
  color: var(--accent);
  margin-bottom: 20px;
}
.result-actions { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
.result-actions button {
  padding: 11px 20px;
  border-radius: 20px;
  font-family: 'Fredoka One', cursive;
  font-size: 1rem;
}
.btn-replay { background: var(--accent); color:#fff; box-shadow:0 3px 10px rgba(15,118,110,.3); }
.btn-menu   { background: var(--card); border: 2px solid var(--border); color:var(--ink-soft); }

</style>
</head>
<body>

<!-- ══════════════ HOME ══════════════ -->
<div id="screen-home" class="screen active">
  <div class="home-hero">
    <span class="app-emoji">🌟</span>
    <h1>Phonics Pals</h1>
    <p>Learn to read with Jolly Phonics!</p>
  </div>

  <div class="group-section">
    <h2>Choose your groups</h2>
    <div class="group-pills">
      <button class="group-pill" data-g="1">1</button>
      <button class="group-pill" data--g="2">2</button>
      <button class="group-pill" data-g="3">3</button>
      <button class="group-pill" data-g="4">4</button>
      <button class="group-pill" data-g="5">5</button>
      <button class="group-pill" data-g="6">6</button>
      <button class="group-pill" data-g="7">7</button>
    </div>
    <div class="group-letters" id="group-letters-preview">Select a group to get started</div>
  </div>

  <div class="menu-section">
    <button class="menu-btn color-green" onclick="startGame('g1')">
      <span class="btn-icon">🔊</span>
      <span class="btn-info">
        <div class="btn-title">Find the Sound</div>
        <div class="btn-desc">Hear a phoneme · Tap the right letter</div>
      </span>
    </button>
    <button class="menu-btn color-blue" onclick="startGame('g2-vc')">
      <span class="btn-icon">🔤</span>
      <span class="btn-info">
        <div class="btn-title">Blend 2 Letters</div>
        <div class="btn-desc">Put two sounds together</div>
      </span>
    </button>
    <button class="menu-btn color-purple" onclick="startGame('g2-cvc')">
      <span class="btn-icon">📖</span>
      <span class="btn-info">
        <div class="btn-title">Read a Word</div>
        <div class="btn-desc">Build a 3-letter word · CVC</div>
      </span>
    </button>
  </div>
</div>

<!-- ══════════════ GAME 1 ══════════════ -->
<div id="screen-g1" class="screen">
  <div class="game-topbar">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="game-title">Find the Sound 🔊</div>
  </div>
  <div class="score-bar">
    <div class="score-pill"><span class="sc-label">✓</span><span class="sc-num" id="g1-correct">0</span></div>
    <div class="score-pill"><span class="sc-label">Q</span><span class="sc-num" id="g1-total">0</span></div>
  </div>
  <div class="g1-stage">
    <div class="g1-prompt-box">
      <div class="g1-prompt">Which letter makes this sound?</div>
      <button class="play-btn" id="g1-play-btn" onclick="g1PlaySound()">🔊</button>
    </div>
    <div class="g1-grid" id="g1-grid"></div>
    <div class="g1-feedback" id="g1-feedback"></div>
    <button class="g1-next-btn" id="g1-next-btn" onclick="g1NextRound()">Next →</button>
  </div>
</div>

<!-- ══════════════ GAME 2 ══════════════ -->
<div id="screen-g2" class="screen">
  <div class="game-topbar">
    <button class="back-btn" onclick="goHome()">← Back</button>
    <div class="game-title" id="g2-title">Blend Letters 🔤</div>
  </div>
  <div class="score-bar">
    <div class="score-pill"><span class="sc-label">✓</span><span class="sc-num" id="g2-correct">0</span></div>
    <div class="score-pill"><span class="sc-label">Q</span><span class="sc-num" id="g2-total">0</span></div>
  </div>
  <div class="g2-stage">
    <!-- Word display -->
    <div class="word-display" id="g2-word-display"></div>
    <!-- Play / blend controls -->

// VC pairs for game 2 level 1 (2-letter blends)
const VC_PAIRS = [
  ['a','t'],['a','n'],['a','p'],['a','d'],['a','g'],['a','m'],['a','b'],
  ['i','t'],['i','p'],['i','n'],['i','d'],['i','g'],['i','m'],

// VOWELS
const VOWELS = new Set(['a','e','i','o','u','ai','ie','ee','oa','or','oo','ou','oi','ue','er','ar']);

// ════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════
let selectedGroup = 0; // 1-7, cumulative
let activeLetters  = []; // letters available in selected groups
let currentGame    = '';
let g1State  = {};
let g2State  = {};
let totalRounds = 10;

// ════════════════════════════════════════════════════════
//  GROUP SELECTION
// ════════════════════════════════════════════════════════
function getGroupPills() {
  return document.querySelectorAll('.group-pill');
}

document.querySelectorAll('.group-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const g = parseInt(pill.getAttribute('data-g') || pill.getAttribute('data--g'));
    selectGroup(g);
  });
});

// fix the data-g attribute typo in HTML for group 2
document.querySelector('[data--g="2"]')?.setAttribute('data-g','2');

function selectGroup(g) {
  selectedGroup = g;
  document.querySelectorAll('.group-pill').forEach(p => {
    const pg = parseInt(p.getAttribute('data-g'));
    p.classList.toggle('selected', pg <= g);
  });
  // Build active letters
  activeLetters = [];
  for(let i=1; i<=g; i++) {
    activeLetters.push(...JP_GROUPS[i-1].letters);
  }
  // Show preview
  const preview = JP_GROUPS.slice(0,g).flatMap(gr=>gr.letters).join(' · ');
  document.getElementById('group-letters-preview').textContent = preview;
}

// Auto-select group 1 on load
selectGroup(1);

// ════════════════════════════════════════════════════════
//  NAVIGATION
// ════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}
function goHome() {
  document.getElementById('result-overlay').classList.remove('show');
  showScreen('home');
}

function startGame(game) {
  if(!selectedGroup) { alert('Please select a group first!'); return; }
  currentGame = game;
  if(game === 'g1') {
    g1Init();
    showScreen('g1');
  } else {
    g2Init(game);
    showScreen('g2');
  }
}

// ════════════════════════════════════════════════════════
//  SPEECH
// ════════════════════════════════════════════════════════
function speak(text, rate=0.85, pitch=1.1) {
  return new Promise(resolve => {
    if(!window.speechSynthesis) { resolve(); return; }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-GB';
    u.rate = rate;
    u.pitch = pitch;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

function speakPhoneme(letter) {
  const src = PHONEME_AUDIO[letter];
  if (!src) return speak(letter, 0.7, 1.15);
  return new Promise(resolve => {
    const audio = new Audio(src);
    audio.onended = resolve;
    audio.onerror = () => resolve();
    audio.play().catch(() => resolve());
  });
}

function speakWord(word) {
  return speak(word, 0.75, 1.1);
}

// ════════════════════════════════════════════════════════
//  HELPERS
// ════════════════════════════════════════════════════════
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick(arr,n) {
  return shuffle(arr).slice(0,n);
}
function rand(arr) {
  return arr[Math.floor(Math.random()*arr.length)];
}

function letterBtn(letter, extraClass='', onclick='') {
  const isDigraph = letter.length>1;
  return `<button class="letter-opt ${extraClass}" ${onclick}>
    <span class="${isDigraph?'dg':''}">${letter.toUpperCase()}</span>
  </button>`;
}

// ════════════════════════════════════════════════════════
//  GAME 1 — FIND THE SOUND
// ════════════════════════════════════════════════════════
function g1Init() {
  g1State = { correct:0, total:0, round:0, target:'', answered:false };
  document.getElementById('g1-correct').textContent = 0;
  document.getElementById('g1-total').textContent = 0;
  g1NextRound();
}

function g1NextRound() {
  // Infinite mode — no round limit
  g1State.round++;
  g1State.answered = false;
  document.getElementById('g1-feedback').textContent = '';
  document.getElementById('g1-next-btn').classList.remove('show');

  // Pick target letter
  const target = rand(activeLetters);
  g1State.target = target;

  // Distractors — other letters from active set, prefer same length
  const others = activeLetters.filter(l=>l!==target);
  // try to make 5 total options (or less if few letters)
  const nOpts = Math.min(6, activeLetters.length);
  const distractors = pick(others, nOpts-1);
  const opts = shuffle([target, ...distractors]);

  const grid = document.getElementById('g1-grid');
  grid.innerHTML = opts.map(l=>
    `<button class="letter-opt" onclick="g1Answer('${l}')">
       <span class="${l.length>1?'dg':''}">${l.toUpperCase()}</span>
     </button>`
  ).join('');

  // Auto-play sound after short delay
  setTimeout(() => g1PlaySound(), 400);
}

async function g1PlaySound() {
  const btn = document.getElementById('g1-play-btn');
  btn.classList.add('playing');
  await speakPhoneme(g1State.target);
  btn.classList.remove('playing');
}

function g1Answer(letter) {
  if(g1State.answered) return;
  g1State.answered = true;
  g1State.total++;
  document.getElementById('g1-total').textContent = g1State.total;

  const btns = document.querySelectorAll('#g1-grid .letter-opt');
  btns.forEach(b => {
    const l = b.querySelector('span').textContent.toLowerCase();
    if(l === letter) b.classList.add(letter===g1State.target?'correct':'wrong');
    if(l === g1State.target && letter !== g1State.target) b.classList.add('correct');
  });

  const fb = document.getElementById('g1-feedback');
  if(letter===g1State.target) {
    g1State.correct++;
    document.getElementById('g1-correct').textContent = g1State.correct;
    fb.textContent = '⭐ Correct!';
  } else {
    fb.textContent = '❌ Try again!';
  }
  document.getElementById('g1-next-btn').classList.add('show');
  // Auto-advance after 1.2s on correct answer
  if(letter===g1State.target) setTimeout(()=>g1NextRound(), 1200);
}

// ════════════════════════════════════════════════════════
//  GAME 2 — BLEND
// ════════════════════════════════════════════════════════
function g2Init(mode) {
  const isCVC = mode==='g2-cvc';
  g2State = {
    mode, correct:0, total:0, round:0, maxRounds:totalRounds,
    answered:false, blended:false,
    wordLetters:[], target:'', missingIdx:0,
    phase: isCVC ? 'cvc' : 'vc'
  };
  document.getElementById('g2-correct').textContent = 0;
  document.getElementById('g2-total').textContent = 0;
  document.getElementById('g2-title').textContent = isCVC ? 'Read a Word 📖' : 'Blend Letters 🔤';
  document.getElementById('cvc-word-reveal').textContent='';
  g2NextRound();
}

function g2NextRound() {
  if(g2State.round >= g2State.maxRounds) { showResult(); return; }
  g2State.round++;
  g2State.answered = false;
  g2State.blended  = false;
  document.getElementById('g2-feedback').textContent='';
  document.getElementById('g2-next-btn').classList.remove('show');
  document.getElementById('cvc-word-reveal').textContent='';
  document.getElementById('g2-blend-btn').style.display='';
  document.getElementById('g2-pick-section').style.display='';

  if(g2State.mode==='g2-cvc') {
    g2LoadCVC();
  } else {
    g2LoadVC();
  }
}

function g2LoadVC() {
  // Pick a VC pair where both letters are in activeLetters
  const avail = VC_PAIRS.filter(p=>p.every(l=>activeLetters.includes(l)));
  if(!avail.length) {
    // fallback: use any
    const p = rand(VC_PAIRS);
    g2State.wordLetters = p;
  } else {
    g2State.wordLetters = rand(avail);
  }
  // Missing: randomly initial consonant or the vowel
  g2State.missingIdx = Math.random()<.5 ? 0 : 1;
  g2State.target = g2State.wordLetters[g2State.missingIdx];

  g2RenderWordDisplay();
  g2BuildOptions();
  setTimeout(()=>g2PlayWord(),400);
}

function g2LoadCVC() {
  // Pick a CVC word whose letters are all in active set
  const avail = ALL_CVC_WORDS.filter(wd=>wd.l.every(l=>activeLetters.includes(l) || l==='c'||l==='k'));
  const chosen = avail.length ? rand(avail) : rand(ALL_CVC_WORDS);
  g2State.wordLetters = chosen.l;
  g2State.wordStr     = chosen.w;
  // Missing letter: randomly one of the three
  g2State.missingIdx  = Math.floor(Math.random()*3);
  g2State.target      = chosen.l[g2State.missingIdx];

  g2RenderWordDisplay();
  g2BuildOptions();
  setTimeout(()=>g2PlayWord(),400);
}

function g2RenderWordDisplay() {
  const disp = document.getElementById('g2-word-display');
  disp.innerHTML = g2State.wordLetters.map((l,i)=>{
    const isVowel = VOWELS.has(l);
    const isDigraph = l.length>1;
    const isMissing = i===g2State.missingIdx && !g2State.answered;
    if(isMissing) {
      return `<div class="letter-box blank">?</div>`;
    }
    return `<div class="letter-box ${isVowel?'vowel':''} ${isDigraph?'digraph':''}" id="lbox-${i}">
      ${l.toUpperCase()}
    </div>`;
  }).join('');
}

function g2RenderWordDisplayRevealed() {
  const disp = document.getElementById('g2-word-display');
  disp.innerHTML = g2State.wordLetters.map((l,i)=>{
    const isVowel = VOWELS.has(l);
    const isDigraph = l.length>1;
    const cls = `letter-box ${isVowel?'vowel':''} ${isDigraph?'digraph':''} ${i===g2State.missingIdx?'reveal':''}`;
    return `<div class="${cls}" id="lbox-${i}">${l.toUpperCase()}</div>`;
  }).join('');
}

function g2BuildOptions() {
  // Distractors from active letters, same length as target
  const target = g2State.target;
  const sameLen = activeLetters.filter(l=>l!==target && l.length===target.length);
  const nOpts = Math.min(6, sameLen.length+1);
  const distractors = pick(sameLen, nOpts-1);
  const opts = shuffle([target, ...distractors]);

  const grid = document.getElementById('g2-grid');
  const label = document.getElementById('g2-opts-label');
  const idx = g2State.missingIdx;
  label.textContent = idx===0 ? 'What sound comes first?' :
                      idx===g2State.wordLetters.length-1 ? 'What is the last sound?' :
                      'What is the middle sound?';

  grid.innerHTML = opts.map(l=>
    `<button class="g2-opt" onclick="g2Answer('${l}')">
       <span class="${l.length>1?'dg':''}">${l.toUpperCase()}</span>
     </button>`
  ).join('');
}

async function g2PlayWord() {
  const btn = document.getElementById('g2-play-btn');
  btn.classList.add('playing');
  // play each letter sound with gap
  for(let l of g2State.wordLetters) {
    await speakPhoneme(l);
    await new Promise(r=>setTimeout(r,180));
  }
  btn.classList.remove('playing');
}

async function g2BlendAnimation() {
  if(g2State.blended) {
    // just play the full word
    if(g2State.wordStr) await speakWord(g2State.wordStr);
    else await speak(g2State.wordLetters.join(''),0.8);
    return;
  }
  g2State.blended = true;
  // Animate boxes sliding together (simple: pulse them)
  const boxes = document.querySelectorAll('#g2-word-display .letter-box');
  boxes.forEach(b=>b.style.transform='scale(1.08)');
  setTimeout(()=>boxes.forEach(b=>b.style.transform=''),300);
  await new Promise(r=>setTimeout(r,400));
  // Speak full blend
  if(g2State.wordStr) await speakWord(g2State.wordStr);
  else await speak(g2State.wordLetters.join(''),0.8);
}

function g2Answer(letter) {
  if(g2State.answered) return;
  g2State.answered = true;
  g2State.total++;
  document.getElementById('g2-total').textContent = g2State.total;

  g2RenderWordDisplayRevealed();

  const btns = document.querySelectorAll('#g2-grid .g2-opt');
  btns.forEach(b=>{
    const l = b.querySelector('span').textContent.toLowerCase();
    if(l===letter) b.classList.add(letter===g2State.target?'correct':'wrong');
    if(l===g2State.target && letter!==g2State.target) b.classList.add('correct');
  });

  const fb = document.getElementById('g2-feedback');
  if(letter===g2State.target) {
    g2State.correct++;
    document.getElementById('g2-correct').textContent = g2State.correct;
    fb.textContent = '⭐ Well done!';
  } else {
    fb.textContent = '❌ The answer was ' + g2State.target.toUpperCase();
  }

  // Reveal full word if CVC
  if(g2State.wordStr) {
    document.getElementById('cvc-word-reveal').innerHTML =
      `The word is <span>${g2State.wordStr.toUpperCase()}</span>`;
    setTimeout(()=>speakWord(g2State.wordStr), 500);
  }

  document.getElementById('g2-next-btn').classList.add('show');
}

// ════════════════════════════════════════════════════════
//  RESULT
// ════════════════════════════════════════════════════════
function showResult() {
  const { correct, total } = currentGame==='g1' ? g1State : g2State;
  const pct = total ? Math.round(correct/total*100) : 0;
  const emoji = pct>=80 ? '🏆' : pct>=50 ? '⭐' : '💪';
  const title = pct>=80 ? 'Brilliant!' : pct>=50 ? 'Good job!' : 'Keep going!';
  const msg   = pct>=80 ? 'Excellent reading!' : pct>=50 ? 'You\'re getting it!' : 'Practice makes perfect!';

  document.getElementById('result-emoji').textContent=emoji;
  document.getElementById('result-title').textContent=title;
  document.getElementById('result-msg').textContent=msg;
  document.getElementById('result-score').textContent=`${correct} / ${total}`;
  document.getElementById('result-overlay').classList.add('show');

  speak(title + ' You got ' + correct + ' out of ' + total, 0.9);
}

function replayGame() {
  document.getElementById('result-overlay').classList.remove('show');
  startGame(currentGame);
}

document.querySelectorAll('.group-pill').forEach(p=>{
  if(p.hasAttribute('data--g')) {
    p.setAttribute('data-g', p.getAttribute('data--g'));
    p.removeAttribute('data--g');
  }
});
// Re-attach events cleanly
document.querySelectorAll('.group-pill').forEach(pill=>{
  pill.onclick = () => selectGroup(parseInt(pill.getAttribute('data-g')));
});
selectGroup(1);
